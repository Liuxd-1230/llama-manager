    <title>Atelier</title>
    <script>
      // Apply theme and accent before first paint; mirrors resolveInitialTheme
      // / resolveInitialAccent in App.tsx.
      try {
        var theme = localStorage.getItem("theme");
        if (theme !== "dark" && theme !== "light") theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        var accent = localStorage.getItem("accent");
        if (accent === "violet" || accent === "ocean" || accent === "amber") document.documentElement.dataset.accent = accent;
      } catch (e) {}
    </script>
